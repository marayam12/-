<title>RenexaMC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0b0f19;
    color: #ffffff;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 380px;
    width: 100%;
  }
  .logo {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    box-shadow: 0 0 0 3px #ec4899, 0 8px 30px rgba(236,72,153,0.35);
    margin: 0 auto 24px;
    display: block;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 10px;
  }
  p {
    color: #9ca3af;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  button {
    background: #ec4899;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 13px 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  button:active { opacity: 0.85; }
  button.secondary {
    background: transparent;
    color: #ec4899;
    border: 2px solid #ec4899;
    margin-top: 12px;
  }
  .status {
    margin-top: 16px;
    font-size: 13px;
    color: #6b7280;
    min-height: 18px;
  }
  [dir="ltr"] body { direction: ltr; }
</style>

    <h1 id="title">لا يوجد اتصال بالإنترنت</h1>
    <p id="msg">لازم تتصل بالإنترنت عشان تدخل RenexaMC — الكوينز، السوق، تسجيل الدخول، وكل شيء ثاني يحتاج اتصال حي بالسيرفر.</p>
    <button id="retryBtn">إعادة المحاولة</button>
    <button id="offlineBtn" class="secondary">غير متصل</button>
    <div class="status" id="status"></div>
  </div>

<script>
(function () {
  var isAr = (navigator.language || "ar").toLowerCase().indexOf("ar") === 0;
  if (!isAr) {
    document.documentElement.lang = "en";
    document.documentElement.dir = "ltr";
    document.getElementById("title").textContent = "No internet connection";
    document.getElementById("msg").textContent = "You need to be online to use RenexaMC \u2014 coins, the marketplace, login, and everything else needs a live connection to the server.";
    document.getElementById("retryBtn").textContent = "Retry";
    document.getElementById("offlineBtn").textContent = "Offline mode";
  }
  var statusEl = document.getElementById("status");
  var retryBtn = document.getElementById("retryBtn");
  var retryText = isAr ? "جارِ التحقق..." : "Checking...";
  var stillOffline = isAr ? "ما زلت غير متصل" : "Still offline";

  retryBtn.addEventListener("click", function () {
    statusEl.textContent = retryText;
    // A same-origin HEAD-ish check would need a real endpoint; the app shell
    // (MainActivity) re-checks connectivity itself and reloads the live site
    // whenever the WebView is refreshed, so a plain reload is enough here.
    setTimeout(function () {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        statusEl.textContent = stillOffline;
      }
    }, 400);
  });

  // Opens the site without internet: the pages work, but anything that needs
  // Firebase (login, chat, market, voting, leaderboard) stays disabled.
  document.getElementById("offlineBtn").addEventListener("click", function () {
    if (window.AndroidBridge && AndroidBridge.openOffline) { AndroidBridge.openOffline(); }
  });

  window.addEventListener("online", function () {
    window.location.reload();
  });
})();
</script>
